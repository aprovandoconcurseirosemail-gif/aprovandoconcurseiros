{t:"Simulado INSS Grátis - 100 Questões Inéditas", b:"CEBRASPE • Fiscal", g:true, preco:"GRÁTIS", rating:"4.9 • 3.247 • vendidos", d:"71% OFF"},
{t:"Pacote Completo TJ-SP - Analista + Oficial", b:"VUNESP • Tribunais", g:false, preco:"R$ 57,99", orig:"R$ 197", rating:"4.9 • 1.823 • vendidos", d:"71% OFF"},
{t:"E-book Português - 300 Pegadinhas FGV Grátis", b:"FGV • Todas", g:true, preco:"GRÁTIS", rating:"5.0 • 5.120 • vendidos", d:""},
{t:"Curso Completo Polícia Federal - Agente", b:"CEBRASPE • Policial", g:false, preco:"R$ 89,90", orig:"R$ 297", rating:"4.8 • 956 • vendidos", d:"70% OFF"},
{t:"Mapas Mentais - Direito Constitucional Grátis", b:"Todas • Todas", g:true, preco:"GRÁTIS", rating:"4.9 • 4.202 • vendidos", d:""},
{t:"Receita Federal - Auditor Fiscal Pacote Ouro", b:"FCC • Fiscal", g:false, preco:"R$ 89,90", orig:"R$ 497", rating:"4.9 • 723 • vendidos", d:"68% OFF"},
{t:"Cronograma 30 Dias - Edital Verticalizado Grátis", b:"Todas • Todas", g:true, preco:"GRÁTIS", rating:"4.9 • 2.890 • vendidos", d:""},
{t:"TRF3 - Técnico e Analista - 2026", b:"FCC • Tribunais", g:false, preco:"R$ 57,99", orig:"R$ 397", rating:"4.8 • 1.102 • vendidos", d:"86% OFF"},
];
function render(filtroTipo="todos", busca=""){
 const grid=document.getElementById('grid'); grid.innerHTML="";
 let lista=prods.filter(p=>{
   if(filtroTipo=="gratis" && !p.g) return false;
   if(filtroTipo=="pago" && p.g) return false;
   if(busca && !p.t.toLowerCase().includes(busca.toLowerCase())) return false;
   return true;
 });
 lista.forEach(p=>{
  grid.innerHTML+=`<div class="bg-white rounded-xl p-3 shadow-sm border hover:shadow-md">
   <div class="bg-gray-50 h-28 rounded-lg flex items-center justify-center relative mb-2">
   <i class="fa-solid fa-book-open text-3xl text-gray-300"></i>
   <span class="absolute top-2 left-2 text-[10px] px-2 py-1 rounded-full font-bold ${p.g?'bg-green-600 text-white':'bg-black text-white'}">${p.g?'GRÁTIS':p.d}</span>
   <span class="absolute top-2 right-2 bg-white rounded-full w-6 h-6 flex items-center justify-center text-gray-400"><i class="fa-regular fa-heart text-xs"></i></span>
   <span class="absolute bottom-1 left-2 text-[10px] text-gray-500">${p.b}</span>
   </div>
   <h3 class="font-bold text-[13px] leading-tight h-10 overflow-hidden">${p.t}</h3>
   <p class="text-[11px] text-gray-500 mt-1"><i class="fa fa-star text-yellow-400"></i> ${p.rating}</p>
   <div class="mt-2">${p.g?`<p class="font-black text-green-600">GRÁTIS</p><p class="text-[10px] text-gray-400 line-through">R$ 97,00</p>`:`<p class="text-[10px] line-through text-gray-400">${p.orig}</p><p class="font-black">${p.preco}</p><p class="text-[10px]">em 12x de R$ 4,83 sem juros</p>`}</div>
   <button onclick="carrinho()" class="w-full mt-3 py-2 rounded-full text-white font-bold text-sm ${p.g?'bg-green-600':'bg-[#0A1931]'}">${p.g?'Baixar Grátis':'Comprar'}</button>
   <p class="text-[10px] text-gray-400 text-center mt-2">✓ Entrega imediata • Acesso vitalício</p>
   </div>`;
 });
}
function carrinho(){document.getElementById('cart').innerText=parseInt(document.getElementById('cart').innerText)+1; alert('Adicionado! Depois você coloca link do seu Kiwify');}
function filtrar(tipo){render(tipo, document.getElementById('busca')?.value||'');}
document.getElementById('busca')?.addEventListener('input', e=>render('todos', e.target.value));
render();
</script>
</body>
</html>
